
{% extends "login_base.html" %}

{% block start %}

<style>
    .login-container {
        max-width: 420px;
        margin: 50px auto;
        padding: 30px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        font-family: Arial, sans-serif;
        box-sizing: border-box;
    }

    .login-title {
        text-align: center;
        margin-bottom: 25px;
        color: #1f2937;
    }

    .mb-3 {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #374151;
    }

    .form-control {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 15px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-text {
        display: block;
        margin-top: 7px;
        font-size: 13px;
        color: #6b7280;
    }

    .check {
        margin-right: 6px;
        cursor: pointer;
    }

    .remember-label {
        color: #374151;
        font-size: 14px;
        cursor: pointer;
    }

    .btn-solid {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn-solid:hover {
        background: #1d4ed8;
    }

    .btn-solid:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
    }

    /* Login error and success messages */
    .message {
        padding: 12px 14px;
        margin-bottom: 20px;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .message.error {
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
    }

    .message.success {
        color: #166534;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
    }

    .message.warning {
        color: #92400e;
        background: #fffbeb;
        border: 1px solid #fde68a;
    }

    .message.info {
        color: #1d4ed8;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
        color: #4b5563;
        font-size: 14px;
    }

    .register-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: bold;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .login-container {
            margin: 25px 15px;
            padding: 22px;
        }
    }
</style>

<div class="login-container">

    <h2 class="login-title">Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="email" class="form-label">
                Email address
            </label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <small class="form-text">
                Enter the email associated with your account.
            </small>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">
                Password
            </label>

            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="mb-3">
            <input
                type="checkbox"
                id="remember_me"
                name="remember_me"
                class="check"
            >

            <label for="remember_me" class="remember-label">
                Remember me
            </label>
        </div>

        
            


        <button type="submit" class="btn-solid">
            Login
        </button>
    </form>

    <p class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>

</div>

{% endblock %}
